[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langchain-graciousquotes"
version = "0.1.0"
description = "LangChain tools that check who really said a quote: a verdict, the source it was traced to, and a citation, from Gracious Quotes' fact-checked records."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [{ name = "Gracious Quotes", email = "jeremiah@graciousquotes.com" }]
keywords = [
  "langchain", "langchain-integration", "quotes", "quote attribution", "misattributed quotes",
  "fact-checking", "citation", "mla", "apa", "agent tools",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Education",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Text Processing :: Linguistic",
]
dependencies = [
  "langchain-core>=0.3.0",
]

[project.urls]
Homepage = "https://graciousquotes.com/developers/langchain/"
Method = "https://graciousquotes.com/how-we-source-quotes/"
Source = "https://github.com/graciousquotes/langchain-graciousquotes"
Issues = "https://github.com/graciousquotes/langchain-graciousquotes/issues"
Terms = "https://graciousquotes.com/terms-and-conditions/#ai"

[project.optional-dependencies]
test = ["pytest>=7", "pytest-asyncio>=0.23", "langchain-tests>=0.3"]

[tool.hatch.build.targets.wheel]
packages = ["langchain_graciousquotes"]

[tool.pytest.ini_options]
# langchain-tests' integration suite is async; without auto mode pytest skips
# straight past the async cases and reports a pass that never ran.
asyncio_mode = "auto"
testpaths = ["tests"]
